<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply — {{ job_title }}</title>
    <style>
    :root {
        /* Premium Grey Palette */
        --bg-main: #121212;
        --bg-card: #1a1a1a;
        --bg-input: #0d0d0d;
        --text-high: #f5f5f5;
        --text-med: #b0b0b0;
        --text-low: #6b7280;
        --accent: #ffffff; /* Keeping it monochromatic and premium */
        --border: #262626;
        --success-bg: rgba(16, 185, 129, 0.1);
        --success-text: #10b981;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Inter', 'Segoe UI', sans-serif;
        background: var(--bg-main);
        color: var(--text-med);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }

    .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        max-width: 560px;
        width: 100%;
        overflow: hidden;
    }

    .card-header {
        /* Gradient changed to subtle grey-to-black for premium feel */
        background: linear-gradient(135deg, #222, #000);
        color: var(--text-high);
        padding: 32px 36px;
        border-bottom: 1px solid var(--border);
    }

    .card-header p {
        font-size: 11px;
        color: var(--text-low);
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 8px;
    }

    .card-header h2 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.5px;
    }

    .card-body { padding: 36px; }

    .form-group { margin-bottom: 24px; }

    label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-high);
        margin-bottom: 8px;
    }

    input[type="text"],
    input[type="email"] {
        width: 100%;
        padding: 14px;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 14px;
        color: var(--text-high);
        transition: all 0.2s;
        outline: none;
    }

    input:focus { 
        border-color: var(--text-low); 
        background: #000;
    }

    /* Premium Upload Area */
    .upload-area {
        border: 2px dashed var(--border);
        border-radius: 12px;
        padding: 40px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s;
        background: var(--bg-input);
    }

    .upload-area:hover, .upload-area.dragover {
        border-color: var(--text-med);
        background: rgba(255, 255, 255, 0.02);
    }

    .upload-area .icon { font-size: 32px; margin-bottom: 12px; opacity: 0.8; }
    .upload-area p { font-size: 14px; color: var(--text-med); font-weight: 500; }
    .upload-area span { font-size: 12px; color: var(--text-low); }

    #fileInput { display: none; }

    .file-selected {
        display: none;
        align-items: center;
        gap: 10px;
        padding: 14px;
        background: var(--success-bg);
        border-radius: 8px;
        font-size: 13px;
        color: var(--success-text);
        margin-top: 15px;
        font-weight: 600;
    }

    .btn-submit {
        width: 100%;
        padding: 16px;
        background: var(--text-high); /* White button on dark theme is very premium */
        color: black;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        margin-top: 10px;
        transition: all 0.3s;
    }

    .btn-submit:hover { 
        background: #ffffff;
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(255,255,255,0.1);
    }
    
    .btn-submit:disabled { 
        background: #333; 
        color: var(--text-low); 
        cursor: not-allowed; 
        transform: none;
    }

    .success-box {
        display: none;
        text-align: center;
        padding: 60px 20px;
    }

    .success-box .icon { font-size: 56px; margin-bottom: 20px; }
    .success-box h3 { font-size: 24px; color: var(--success-text); margin-bottom: 12px; }
    .success-box p { font-size: 15px; color: var(--text-med); line-height: 1.6; }

    .error-msg {
        display: none;
        padding: 14px;
        background: rgba(239, 68, 68, 0.1);
        border-left: 4px solid #ef4444;
        border-radius: 4px;
        font-size: 13px;
        color: #ef4444;
        margin-bottom: 20px;
    }

    .loading { 
        display: none; 
        text-align: center; 
        padding: 15px; 
        color: var(--text-low); 
        font-size: 13px; 
        font-family: monospace;
    }
</style>
</head>
<body>

<div class="card">
    <div class="card-header">
        <p>📋 Applying for</p>
        <h2>{{ job_title }}</h2>
    </div>

    <div class="card-body">

        <!-- Error message -->
        <div class="error-msg" id="errorMsg"></div>

        <!-- Application Form -->
        <div id="applicationForm">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="candidateName" placeholder="e.g. Anusree K P" required>
            </div>

            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" id="candidateEmail" placeholder="e.g. anusree@gmail.com" required>
            </div>

            <div class="form-group">
                <label>Resume (PDF or DOCX) *</label>
                <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                    <div class="icon">📄</div>
                    <p>Click to upload or drag & drop</p>
                    <span>PDF or DOCX — max 5MB</span>
                </div>
                <input type="file" id="fileInput" accept=".pdf,.docx" onchange="fileSelected(this)">
                <div class="file-selected" id="fileSelected">
                    ✅ <span id="fileName"></span>
                </div>
            </div>

            <div class="loading" id="loadingMsg">⏳ Submitting your application...</div>

            <button class="btn-submit" id="submitBtn" onclick="submitApplication()">
                Submit Application →
            </button>
        </div>

        <!-- Success State -->
        <div class="success-box" id="successBox">
            <div class="icon">🎉</div>
            <h3>Application Submitted!</h3>
            <p>Thank you for applying. Our team will review your resume and get back to you soon.</p>
            <br>
            <p style="color:#9ca3af; font-size:12px;">You can close this tab now.</p>
        </div>

    </div>
</div>

<script>
    const JD_FILENAME = "{{ filename }}";

    // Drag and drop
    const uploadArea = document.getElementById('uploadArea');
    uploadArea.addEventListener('dragover', e => {
        e.preventDefault();
        uploadArea.classList.add('dragover');
    });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
    uploadArea.addEventListener('drop', e => {
        e.preventDefault();
        uploadArea.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file) setFile(file);
    });

    function fileSelected(input) {
        if (input.files[0]) setFile(input.files[0]);
    }

    function setFile(file) {
        document.getElementById('fileName').textContent = file.name;
        document.getElementById('fileSelected').style.display = 'flex';
        // Store file in hidden input
        const dt = new DataTransfer();
        dt.items.add(file);
        document.getElementById('fileInput').files = dt.files;
    }

    async function submitApplication() {
        const name = document.getElementById('candidateName').value.trim();
        const email = document.getElementById('candidateEmail').value.trim();
        const fileInput = document.getElementById('fileInput');
        const errorMsg = document.getElementById('errorMsg');

        // Validate
        errorMsg.style.display = 'none';
        if (!name) return showError('Please enter your full name.');
        if (!email || !email.includes('@')) return showError('Please enter a valid email address.');
        if (!fileInput.files[0]) return showError('Please upload your resume.');

        // Disable button
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        document.getElementById('loadingMsg').style.display = 'block';

        // Build form data
        const formData = new FormData();
        formData.append('candidate_name', name);
        formData.append('candidate_email', email);
        formData.append('resume', fileInput.files[0]);
        formData.append('jd_filename', JD_FILENAME);

        try {
            const res = await fetch('/api/candidate-apply', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();

            if (data.success) {
                document.getElementById('applicationForm').style.display = 'none';
                document.getElementById('successBox').style.display = 'block';
            } else {
                showError(data.error || 'Submission failed. Please try again.');
                btn.disabled = false;
            }
        } catch (e) {
            showError('Network error. Please try again.');
            btn.disabled = false;
        }

        document.getElementById('loadingMsg').style.display = 'none';
    }

    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.textContent = msg;
        el.style.display = 'block';
    }
</script>

</body>
</html>
